# prodとついているが、実際は本番リリースをイメージして簡易的につくった内容
services:
    spring-verify:
        build:
            context: .
            dockerfile: Dockerfile.prod
        container_name: spring-verify-prod
        environment:
            DB_HOST: spring-db-prod
            DB_PORT: 5432
            JPA_DDL_AUTO: update
            POSTGRES_DATABASE_NAME: ${POSTGRES_DATABASE_NAME}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - 18080:8080
        depends_on:
            spring-db-prod:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s # 💡 JARの起動には少し時間がかかるので長めに設定
            #test: ["CMD", "test", "-f", "/tmp/started"]
            #interval: 10s
            #timeout: 5s
            #retries: 5
            #start_period: 30s

    web-nginx:
        image: nginx:latest
        container_name: web-nginx-prod
        ports:
            - 80:80
        depends_on:
            spring-verify:
                condition: service_healthy # Spring BootがUPになるまで待機！

    spring-db-prod:
        image: postgres:18
        container_name: spring-db-prod
        environment:
            POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - 15432:5432
        volumes:
            - db-prod-store:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE_NAME}']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    db-prod-store: