<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title th:text="#{login.title}">ログイン - Spring Boot 機能検証サンドボックス</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                min-height: 100vh;
                background-color: #f8f9fa;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>
    <body class="bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white text-center py-3">
                            <h4 class="card-title mb-0" th:text="#{login.heading}">🔐 ログイン</h4>
                        </div>

                        <div class="card-body p-4">
                            <!-- ログイン失敗時のエラーメッセージ表示 -->
                            <div
                                th:if="${param.error}"
                                class="alert alert-danger"
                                role="alert"
                                th:text="#{login.error.message}"
                            >
                                メールアドレスまたはパスワードが間違っています。
                            </div>

                            <!-- ログアウト成功時のメッセージ表示 -->
                            <div
                                th:if="${param.logout}"
                                class="alert alert-success"
                                role="alert"
                                th:text="#{login.logout.message}"
                            >
                                ログアウトしました。
                            </div>

                            <form th:action="@{/login}" method="post">
                                <!-- ユーザー名（メールアドレスなど）入力 -->
                                <div class="mb-3">
                                    <label for="username" class="form-label" th:text="#{login.label.username}"
                                        >メールアドレス</label
                                    >
                                    <input
                                        type="text"
                                        id="username"
                                        name="username"
                                        class="form-control"
                                        th:placeholder="#{login.placeholder.username}"
                                        required
                                        autofocus
                                    />
                                </div>

                                <!-- パスワード入力 -->
                                <div class="mb-3">
                                    <label for="password" class="form-label" th:text="#{login.label.password}"
                                        >パスワード</label
                                    >
                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        class="form-control"
                                        required
                                    />
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary" th:text="#{login.button.submit}">
                                        ログイン
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
