<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>500 Internal Server Error - システムエラー</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                background-color: #f1f3f5;
                min-height: 100vh;
                display: flex;
                align-items: center; /* 💡 画面の縦方向の真ん中に配置 */
            }
            .error-code {
                font-size: 8rem;
                font-weight: 900;
                color: #dc3545; /* 500エラーは最上級の警告なので、鮮やかな赤（danger） */
                line-height: 1;
                text-shadow: 0 4px 10px rgba(220, 53, 69, 0.2);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 text-center">
                    <div class="error-code mb-4">500</div>

                    <div class="card shadow-sm p-5 bg-white rounded">
                        <h1 class="h3 fw-bold text-dark mb-3">システムエラーが発生しました</h1>

                        <p class="text-muted mb-4">
                            申し訳ございません。システム内で予期せぬエラーが発生したため、一時的にリクエストを処理できませんでした。<br />
                            ネットワークの接続状況を確認し、時間を置いてもう一度お試しいただくか、トップページへお戻りください。
                        </p>

                        <div class="bg-light rounded p-3 mb-4 text-start small text-secondary">
                            ℹ️ <strong>開発者へのメモ:</strong><br />
                            このエラーの具体的な発生原因（スタックトレース）は、昨日あなた自身が魂を込めて設計したコンソールの<b
                                >アプリケーションログ（WebLogAspectの [FAIL] ログ）</b
                            >に100%記録されています。トレースIDを元にコンソールを追跡してください。
                        </div>

                        <a href="/" class="btn btn-primary btn-lg px-4 shadow-sm"> 🏠 トップページへ戻る </a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
