<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>405 Method Not Allowed - 許可されていないアクセス</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                background-color: #f1f3f5;
                min-height: 100vh;
                display: flex;
                align-items: center; /* 💡 画面の縦方向の真ん中に配置 */
            }
            .error-code {
                font-size: 8rem;
                font-weight: 900;
                color: #deb841; /* 405は警告色っぽいダークイエロー/オレンジに */
                line-height: 1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 text-center">
                    <div class="error-code mb-4">405</div>

                    <div class="card shadow-sm p-5 bg-white rounded text-start">
                        <h1 class="h3 fw-bold text-dark text-center mb-3" th:text="#{error.title.405}">
                            405 Method Not Allowed
                        </h1>

                        <p class="text-muted text-center mb-4">
                            指定されたURLへのリクエスト方法（HTTPメソッド）が正しくありません。
                        </p>

                        <div class="alert alert-warning border-0 shadow-sm p-4 mb-4">
                            <h5 class="alert-heading fw-bold mb-3">🔍 エラー詳細情報</h5>
                            <ul class="mb-0 list-unstyled d-flex flex-column gap-2">
                                <li>
                                    <span class="text-secondary me-2">あなたが試した方法:</span>
                                    <span class="badge bg-danger fs-6 px-3" th:text="${requestedMethod}">GET</span>
                                </li>
                                <li>
                                    <span class="text-secondary me-2">許可されている方法:</span>
                                    <span
                                        class="badge bg-success fs-6 px-3"
                                        th:text="${#strings.arrayJoin(supportedMethods, ', ')}"
                                        >POST, PUT</span
                                    >
                                </li>
                            </ul>
                        </div>

                        <div class="text-center">
                            <a href="/" class="btn btn-primary btn-lg px-4 shadow-sm"> 🏠 トップページへ戻る </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
