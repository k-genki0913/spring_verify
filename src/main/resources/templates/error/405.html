<!-- HTMLはあまり意識したくないから、基本的にGeminiが出力したものでThymeleafで出力する部分のみこだわる -->
<!-- スタイルとかはおまかせ -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>405 Method Not Allowed from GlobalHtmlExceptionHandler-handleMethodNotAllowed</title>
        <style>
            body {
                font-family: sans-serif;
                margin: 50px;
                color: #333;
            }
            .error-container {
                border: 1px solid #ccc;
                padding: 30px;
                border-radius: 5px;
                background: #f9f9f9;
            }
            h1 {
                color: #d9534f;
            }
            code {
                background: #eee;
                padding: 2px 6px;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div class="error-container">
            <h1 th:text="#{error.title.405}">エラーが発生しました</h1>
            <p>お探しのページは存在しますが、リクエストされた方法でのアクセスは許可されていません。</p>

            <hr />

            <ul>
                <li>あなたが試したリクエスト方法: <code th:text="|[${requestedMethod}]|">GET</code></li>
                <li>
                    このページが許可している方法:
                    <code th:text="|[${#strings.arrayJoin(supportedMethods, ', ')}]|">[POST, PUT]</code>
                </li>
            </ul>

            <p><a href="/">トップページへ戻る</a></p>
        </div>
    </body>
</html>
