<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 Not Found - ページが見つかりません</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                background-color: #f1f3f5;
                min-height: 100vh;
                display: flex;
                align-items: center; /* 💡 画面の縦方向の真ん中に配置 */
            }
            .error-code {
                font-size: 8rem;
                font-weight: 900;
                color: #6c757d;
                line-height: 1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="error-code mb-4">404</div>

                    <div class="card shadow-sm p-5 bg-white rounded">
                        <h1 class="h3 fw-bold text-dark mb-3" th:text="#{error.title.404}">404 Not Found</h1>

                        <p class="text-muted mb-4">
                            申し訳ありません。お探しのページは削除されたか、URLが間違っている可能性があります。
                        </p>

                        <a href="/" class="btn btn-primary btn-lg px-4 shadow-sm"> 🏠 トップページへ戻る </a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
