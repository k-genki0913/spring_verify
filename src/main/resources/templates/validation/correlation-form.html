<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
    <body>
        <div class="container mt-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="card-title mb-0">👤 ユーザー登録（相関チェック検証）</h4>
                </div>
                <div class="card-body">
                    <form
                        th:action="@{/validation/correlation/form}"
                        th:object="${correlationUserRegistForm}"
                        method="post"
                        novalidate
                    >
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                            </ul>
                        </div>
                        <div class="mb-3">
                            <label for="userId" class="form-label fw-bold">ユーザーID</label>
                            <input
                                type="text"
                                th:field="*{userId}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('userId')} ? 'is-invalid'"
                            />
                            <div
                                class="invalid-feedback"
                                th:if="${#fields.hasErrors('userId')}"
                                th:errors="*{userId}"
                            ></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">パスワード</label>
                            <input
                                type="password"
                                th:field="*{password}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                            />
                            <div
                                class="invalid-feedback"
                                th:if="${#fields.hasErrors('password')}"
                                th:errors="*{password}"
                            ></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">メールアドレス</label>
                            <input
                                type="email"
                                th:field="*{email}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                            />
                            <div
                                class="invalid-feedback"
                                th:if="${#fields.hasErrors('email')}"
                                th:errors="*{email}"
                            ></div>
                        </div>

                        <div class="mb-3">
                            <label for="retryEmail" class="form-label fw-bold">メールアドレス（再入力）</label>
                            <input
                                type="email"
                                th:field="*{retryEmail}"
                                class="form-control"
                                th:classappend="${#fields.hasErrors('retryEmail')} ? 'is-invalid'"
                            />
                            <div
                                class="invalid-feedback"
                                th:if="${#fields.hasErrors('retryEmail')}"
                                th:errors="*{retryEmail}"
                            ></div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <button type="submit" class="btn btn-primary px-5">登録する</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
