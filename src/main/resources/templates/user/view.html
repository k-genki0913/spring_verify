<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
    <body>
        <div class="container mt-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <h4 class="card-title mb-0">👥 ユーザー一覧</h4>
                </div>

                <div class="card-body">
                    <form th:action="@{/users}" method="get" class="row g-3 mb-4">
                        <div class="col-auto">
                            <input
                                type="text"
                                name="keyword"
                                th:value="${keyword}"
                                class="form-control"
                                placeholder="名前で検索..."
                            />
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary">検索</button>
                            <a th:href="@{/users}" class="btn btn-outline-secondary">クリア</a>
                        </div>
                    </form>

                    <div th:if="${#lists.isEmpty(users)}" class="alert alert-info" role="alert">
                        該当するユーザーが見つかりません。
                    </div>

                    <table class="table table-hover table-striped" th:if="${not #lists.isEmpty(users)}">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">名前</th>
                                <th scope="col">メールアドレス</th>
                                <th scope="col" class="text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.name}">山田 太郎</td>
                                <td th:text="${user.email}">yamada@example.com</td>
                                <td class="text-center">
                                    <a
                                        th:href="@{/users/{id}/edit(id=${user.id})}"
                                        class="btn btn-sm btn-outline-primary"
                                        >編集</a
                                    >
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer text-end">
                    <a href="/" class="btn btn-outline-secondary">戻る</a>
                </div>
            </div>
        </div>
    </body>
</html>
