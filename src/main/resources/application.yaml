# =========================================================================
#  共通 ＆ ローカル環境（デフォルト）の設定
# =========================================================================
spring:
    application:
        name: verify
    datasource:
        url: jdbc:postgresql://${DB_HOST:spring-db}:${DB_PORT:5432}/${POSTGRES_DATABASE_NAME}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:none}
        show-sql: true
    messages:
        basename: messages
        encoding: UTF-8
    web:
        locale: ja # デフォルトのロケールを日本語に固定

logging:
    level:
        root: INFO
        '[com.github.k.genki0913.verify]': DEBUG
    pattern:
        # settings for local : 1ミリの狂いもなく縦のラインが美しく整列する構造化ログ仕様
        # [%-22thread]       : スレッド番号（exec-10等）の文字切れを防ぐため、最大値制限(.22)はつけず、最小22文字幅で右詰めスペース埋め
        # [%-8.8X{traceId}]  : AOPで発行したトレースIDを8文字固定で出力（空の時は8文字分の空白をキープ）
        # [%highlight(...)]  : ログレベルを5文字固定し、ERRORは赤、WARNは黄など自動で色付け
        # %clr(...){magenta} : パッケージ名を省いたクラス名({0})を20文字固定し、マゼンタ色（紫ピンク）で着色
        # [%-5.5X{status}]   : 💡 AOPで制御する処理ステータス（START/END/FAIL）を5文字固定でメッセージの直前に配置
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%-22thread] [%-8.8X{traceId}] [%highlight(%-5level)] %clr(%-20.20logger{0}){magenta} - [%-5.5X{status}] %msg%n'

---
# ↑この「---」が、1つのファイル内で環境を隔てる境界線

# =========================================================================
# AWS（dev）環境専用の上書き設定
#
# 【設計理由（マルチドキュメント構成を採用）】
# 1. 1ファイルに集約することで、環境間の設定漏れや迷子を100%防止するため。
# 2. クラウド環境では機密情報を「環境変数」で扱うため、yaml自体は肥大化しないため。
# =========================================================================
spring:
    config:
        activate:
            on-profile: dev # プロファイル「dev」が指定された時だけ、ここから下で上書き
    jpa:
        hibernate:
            ddl-auto: update

logging:
    pattern:
        # AWS用：CloudWatchで見やすいように「色なし（文字化け防止）」＆「フルパッケージ名」＆「等幅整列」
        # 順番（左側のフォーマット）をローカル用と完全に合わせることで、環境が変わっても解析しやすくなります
        console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%-22thread] [%-8.8X{traceId}] [%-5level] %logger{100} - [%-5.5X{status}] %msg%n'
