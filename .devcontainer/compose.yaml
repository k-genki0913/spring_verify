services:
    spring-verify:
        build:
            context: ../
            dockerfile: .devcontainer/Dockerfile
        container_name: spring-verify
        tty: true
        environment:
            #  --- 開発・アプリ用 ---
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            POSTGRES_DATABASE_NAME: ${POSTGRES_DATABASE_NAME}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            # --- テスト用 ---
            DB_TEST_HOST: ${DB_TEST_HOST}
            DB_TEST_PORT: ${DB_TEST_PORT}
            POSTGRES_TEST_DATABASE_NAME: ${POSTGRES_TEST_DATABASE_NAME}
            POSTGRES_TEST_USER: ${POSTGRES_TEST_USER}
            POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD}

            JPA_DDL_AUTO: ${JPA_DDL_AUTO}
        volumes:
            - ../:/app
            # maven 依存ライブラリをキャッシュするために利用
            - maven-repo:/root/.m2
        ports:
            - 18080:8080
        depends_on:
            spring-db:
                condition: service_healthy
            spring-db-test:
                condition: service_healthy

    spring-db:
        image: postgres:18
        labels:
            - 'org.springframework.boot.service-connection=postgres'
        container_name: spring-db
        environment:
            POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - 15432:5432
        volumes:
            - db-store:/var/lib/postgresql
            - ./postgres_logs:/var/log/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE_NAME}']
            interval: 5s # 5秒おきにチェック
            timeout: 5s # 5秒でタイムアウトしたら失敗
            retries: 5

    spring-db-test:
        image: postgres:18
        labels:
            - 'org.springframework.boot.service-connection=postgres'
        container_name: ${DB_CONTAINER_NAME:-spring-db-test}
        environment:
            POSTGRES_DB: ${POSTGRES_TEST_DATABASE_NAME}
            POSTGRES_USER: ${POSTGRES_TEST_USER}
            POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
        ports:
            - ${DB_TEST_HOST_PORT:-25432}:5432
        volumes:
            - db-test-store:/var/lib/postgresql
            - ./postgres_logs:/var/log/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DATABASE_NAME}']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    db-store:
    db-test-store:
    maven-repo:
